; 小柚摇杆遥控器：M5StickC Plus2 + Hat Joystick（顶上灰色摇杆帽）
; 编译：pio run    刷机（USB-C 插 Mac）：pio run -t upload
[env:stickc-plus2]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17（BLE 键盘库在 3.x 上编译不过）
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv ; 蓝牙 + Wi-Fi(ESP-NOW) + 中文字体，默认分区放不下
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  m5stack/M5Unified@^0.2.2
  t-vk/ESP32 BLE Keyboard@^0.3.2
build_flags =
  -DCORE_DEBUG_LEVEL=0
